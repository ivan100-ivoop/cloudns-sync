// Main BIND configuration used for safe discovery tests.
options {
    directory "/var/named";
};

zone "example.com" {
    type master;
    file "/var/named/example.com.db";
};

# A master zone with unusual formatting.
zone 'example.net'
{
    type    master;
    file "/var/named/example.net.db";
};

zone "secondary-example.com" {
    type slave;
    masters { 192.0.2.10; };
    file "/var/named/slaves/secondary-example.com.db";
};
